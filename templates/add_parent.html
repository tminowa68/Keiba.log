{% extends "layout.html" %}
{% block title %}血統登録 - keiba.log{% endblock %}
{% block content %}
<h2>血統の登録</h2>
<section>
<form action="/add_parent" method="POST" autocomplete="off">
    <input type="hidden" name="p_name" value="{{ p_name }}">
    <input type="hidden" name="origin" value="{{ origin }}">
    
    <div style="margin-bottom: 15px;">
        <label>登録種別：</label>
        <strong>{{ '父 (Sire)' if p_type == 'Sire' else '母 (Dam)' }}</strong>
        <input type="hidden" name="p_type" value="{{ p_type }}">
    </div>

    <div style="margin-bottom: 15px;">
        <label>馬名：</label>
        <strong>{{ p_name }}</strong>
        <input type="hidden" name="p_name" value="{{ p_name }}">
    </div>

    <div style="margin-bottom:15px;">
        <label>血統：</label><br>
        <input type="text" name="sire" value="{{ data.sire }}" placeholder="父" style="width:140px; padding:8px;">
        ×
        <input type="text" name="dam" value="{{ data.dam }}" placeholder="母" style="width:140px; padding:8px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label>生年月日：</label>
        <input type="number" name="year" value="{{ data.year if data else '' }}" oninput="if(value.length > 4) value = value.slice(0, 4);" style="width:50px; padding:8px;" required>年
        
        {% set m_val = data.month|int if data and data.month else 0 %}
        {% set is_sh = m_val >= 7 %}
        
        <select name="month" id="parent_month" style="padding:8px;">
            <option value="" {% if not m_val %}selected{% endif %}></option>
            {% set start_m = 7 if is_sh else 1 %}
            {% set end_m = 12 if is_sh else 6 %}
            {% for m in range(start_m, end_m + 1) %}
            <option value="{{ m }}" {% if m == m_val %}selected{% endif %}>{{ m }}</option>
            {% endfor %}
        </select> 月
        <select name="day" style="padding:8px;">
            <option value="" {% if not data or not data.day %}selected{% endif %}></option>
            {% for d in range(1, 32) %}
            <option value="{{ d }}" {% if data and d == data.day|int %}selected{% endif %}>{{ d }}</option>
            {% endfor %}
        </select> 日
    </div>

    <div style="margin-bottom:15px;">
        <label>馬主名：</label>
        <input type="text" name="owner" value="{{ data.owner }}" placeholder="馬主名" style="width: 200px; padding:8px; margin-top:5px;">
    </div>
    
    <div style="margin-top: 8px; display: inline-flex; gap: 5px; align-items: center;">
        <label>産地：</label>
        <select name="birthplace_region" id="parent_region_select" value="" style="padding:6px;">
        </select>
        <select name="birthplace_detail" id="parent_detail_select" value="" style="padding:6px; display: none;">
        </select>
    </div>

    <div style="margin-bottom:15px; margin-top: 15px;">
        <label>生産牧場：</label>
        <input type="text" name="breeder" value="{{ data.breeder }}" placeholder="生産牧場" style="width: 200px; padding:8px; margin-top:5px;">
    </div>

    <div style="margin-top: 20px;">
        <button type="submit" class="btn-save">登録する</button>
        <a href="{{ url_for('horse_detail', name=origin) if origin else '/' }}" class="btn-cancel">キャンセル</a>
    </div>
</form>
</section>

<script>
// 【産地データ定義】ここを編集することでいつでも選択肢を追加・変更できます
const locationData = {
    "北海道": [
        "厚真町", "安平町", "池田町", "浦河町", "えりも町", 
        "追分町", "荻伏村", "帯広市", "様似町", "静内町", 
        "士幌町", "白老町", "新ひだか町", "大樹町", "伊達市", 
        "伊達町", "千歳市", "洞爺湖町", "洞爺村", "苫小牧市", 
        "豊浦町", "新冠町", "登別市", "早来町", "日高町", 
        "平取町", "三石町", "むかわ町", "鵡川町", "室蘭市", 
        "森町", "門別町"
    ],
    "青森県": [],
    "茨城県": [],
    "栃木県": [],
    "千葉県": [],
    "熊本県": [],
    "宮崎県": [],
    "海外": [
        "アメリカ", "カナダ", 
        "イギリス", "アイルランド", "フランス", "ドイツ", "イタリア", 
        "デンマーク", "スウェーデン", 
        "オーストラリア", "ニュージーランド",
        "アルゼンチン", "チリ", "ブラジル", "ウルグアイ", "ペルー", 
        "南アフリカ"
    ]
};

// 【南半球産リスト】ここに指定された地域が選ばれた時、7〜12月表示に切り替わります
const southernHemisphereDetails = [
    "オーストラリア", "ニュージーランド", 
    "アルゼンチン", "チリ", "ブラジル", "ウルグアイ", "ペルー", 
    "南アフリカ"
];

// 【市町村の存続期間データ】市町村合併・市制施行等により名称が変わった産地の
// 「存在していた期間」を管理します。start=誕生日（合併・市制施行日など）、
// end=消滅日（次の合併等でその名称が無くなった日）。null は無期限（起源が古く
// 制限不要、または現在も存続中）を意味します。ここに無い名称は無条件で選択可能です。
// 例：静内町・三石町は2006/3/31に合併し「新ひだか町」になったため、
// 　　静内町・三石町は2006/3/31以降、新ひだか町は2006/3/31より前は選べません。
const municipalityValidity = {
    "静内町":     { start: null,          end: "2006-03-31" },
    "三石町":     { start: null,          end: "2006-03-31" },
    "新ひだか町": { start: "2006-03-31", end: null },
    "早来町":     { start: null,          end: "2006-03-27" },
    "追分町":     { start: null,          end: "2006-03-27" },
    "安平町":     { start: "2006-03-27", end: null },
    "鵡川町":     { start: null,          end: "2006-03-27" },
    "むかわ町":   { start: "2006-03-27", end: null },
    "洞爺村":     { start: null,          end: "2006-03-27" },
    "洞爺湖町":   { start: "2006-03-27", end: null },
    // 門別町は2006/3/1に（旧）日高町と合体し新設合併したが、新町名も「日高町」を
    // 継承したため、日高町自体には存続制限を設けない（門別町のみ2006/3/1以降不可）
    "門別町":     { start: null,          end: "2006-03-01" },
    // 荻伏町（村）は1902/4/1発足、1956/9/30に浦河町へ編入され消滅
    "荻伏村":     { start: "1902-04-01", end: "1956-09-30" },
    "伊達市":     { start: "1972-04-01", end: null },
    "伊達町":     { start: "1925-08-01", end: "1972-04-01" },
    "千歳市":     { start: "1958-07-01", end: null },
    "苫小牧市":   { start: "1948-04-01", end: null },
    "登別市":     { start: "1970-04-01", end: null },
    "室蘭市":     { start: "1922-08-01", end: null },
    "帯広市":     { start: "1933-04-01", end: null }
};

function _parseISODate(str) {
    if (!str) return null;
    const p = str.split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2]));
}

// 入力された生年月日から「その馬が生まれた期間」の幅を計算する。
// 日まで入力→その1日だけ／月まで入力→その月全体／年のみ→その年全体、として厳密さを調整する。
function _computeBirthPeriod(yearVal, monthVal, dayVal) {
    const y = parseInt(yearVal, 10);
    if (!y) return null;
    if (monthVal && dayVal) {
        const m = parseInt(monthVal, 10), d = parseInt(dayVal, 10);
        if (!m || !d) return null;
        const start = new Date(Date.UTC(y, m - 1, d));
        const end = new Date(Date.UTC(y, m - 1, d + 1));
        return { start, end };
    } else if (monthVal) {
        const m = parseInt(monthVal, 10);
        if (!m) return null;
        const start = new Date(Date.UTC(y, m - 1, 1));
        const end = new Date(Date.UTC(y, m, 1));
        return { start, end };
    } else {
        const start = new Date(Date.UTC(y, 0, 1));
        const end = new Date(Date.UTC(y + 1, 0, 1));
        return { start, end };
    }
}

// 指定した産地名が、算出した生年期間に実在していたかどうかを判定する
function isMunicipalityAvailable(name, birthPeriod) {
    const v = municipalityValidity[name];
    if (!v) return true; // 存続期間データが無い（制限不要）ものは常に選択可
    if (!birthPeriod) return true; // 生年未入力の間は絞り込まない
    const vStart = v.start ? _parseISODate(v.start) : new Date(Date.UTC(1, 0, 1));
    const vEnd = v.end ? _parseISODate(v.end) : new Date(Date.UTC(9999, 0, 1));
    return birthPeriod.start < vEnd && birthPeriod.end > vStart;
}

function initParentBirthplaceFields(monthSelectId, hasEmptyOption) {
    const regionSelect = document.getElementById('parent_region_select');
    const detailSelect = document.getElementById('parent_detail_select');
    if (!regionSelect || !detailSelect) return;

    // Jinja2テンプレートから既存データを受け取る（なければ空文字）
    const initialRegion = "{{ data.birthplace_region if data and data.birthplace_region else '' }}";
    const initialDetail = "{{ data.birthplace_detail if data and data.birthplace_detail else '' }}";
    const isSH = {{ 'true' if is_sh else 'false' }};

    // 産地（第1階層）の選択肢を生成
    regionSelect.innerHTML = '';
    for (const region in locationData) {
        const opt = document.createElement('option');
        opt.value = region;
        opt.textContent = region;
        regionSelect.appendChild(opt);
    }

    // フォーム内の生年月日入力欄を取得（存続期間の判定に使用）
    const parentForm = regionSelect.closest('form');
    const birthYearInput = parentForm ? parentForm.querySelector('input[name="year"]') : null;
    const birthDaySelect = parentForm ? parentForm.querySelector('select[name="day"]') : null;

    function getCurrentBirthPeriod() {
        const monthSelectEl = document.getElementById(monthSelectId);
        return _computeBirthPeriod(
            birthYearInput ? birthYearInput.value : '',
            monthSelectEl ? monthSelectEl.value : '',
            birthDaySelect ? birthDaySelect.value : ''
        );
    }

    // 産地変更時の連動処理
    regionSelect.addEventListener('change', function() {
        const selectedRegion = this.value;
        const rawDetails = locationData[selectedRegion] || [];
        const birthPeriod = getCurrentBirthPeriod();
        // 生年月日から見て、廃止済み・制定前の市町村は選択肢から除外する
        const details = rawDetails.filter(d => isMunicipalityAvailable(d, birthPeriod));

        detailSelect.innerHTML = '';

        if (details.length > 0) {
            details.forEach(detail => {
                const opt = document.createElement('option');
                opt.value = detail;
                opt.textContent = detail;
                detailSelect.appendChild(opt);
            });
            detailSelect.style.display = 'inline-block';
        } else {
            detailSelect.style.display = 'none';
        }

        updateMonthByLocation(monthSelectId, detailSelect.value, hasEmptyOption);
    });

    // 詳細地域変更時の処理
    detailSelect.addEventListener('change', function() {
        updateMonthByLocation(monthSelectId, this.value, hasEmptyOption);
    });

    // 生年月日が変更されたら、産地（詳細）の選択肢を生年月日に合わせて再計算する。
    // それまでの選択が引き続き有効な場合は選択状態を維持し、無効になった場合のみ解除される。
    function refreshDetailAvailability() {
        const currentDetailValue = detailSelect.value;
        
        // 【追加】現在選択されている月の値を一時的に退避しておく
        const monthSelectEl = document.getElementById(monthSelectId);
        const currentMonthValue = monthSelectEl ? monthSelectEl.value : '';

        regionSelect.dispatchEvent(new Event('change'));
        
        if (currentDetailValue) {
            const stillAvailable = [...detailSelect.options].some(o => o.value === currentDetailValue);
            if (stillAvailable) {
                detailSelect.value = currentDetailValue;
                // 選択を復元したので、月の選択肢（南半球判定含む）もその値に合わせて再計算する
                updateMonthByLocation(monthSelectId, detailSelect.value, hasEmptyOption);
                
                // 【追加】退避しておいた月の値を復元する
                if (currentMonthValue && [...monthSelectEl.options].some(o => o.value === currentMonthValue)) {
                    monthSelectEl.value = currentMonthValue;
                }
            }
        }
    }
    if (birthYearInput) birthYearInput.addEventListener('input', refreshDetailAvailability);
    const monthSelectForListener = document.getElementById(monthSelectId);
    if (monthSelectForListener) monthSelectForListener.addEventListener('change', refreshDetailAvailability);
    if (birthDaySelect) birthDaySelect.addEventListener('change', refreshDetailAvailability);

    // 初期データのマッピング処理
    if (initialRegion && locationData[initialRegion]) {
        regionSelect.value = initialRegion;
        regionSelect.dispatchEvent(new Event('change'));
        if (initialDetail && locationData[initialRegion].includes(initialDetail)) {
            detailSelect.value = initialDetail;
            detailSelect.dispatchEvent(new Event('change'));
        }
    } else if (isSH) {
        // 産地データはないが月データから南半球（7〜12月）と判定できる場合の初期表示
        regionSelect.value = "海外";
        regionSelect.dispatchEvent(new Event('change'));
        detailSelect.value = "オーストラリア";
        detailSelect.dispatchEvent(new Event('change'));
    } else {
        regionSelect.dispatchEvent(new Event('change'));
    }
}

function updateMonthByLocation(monthSelectId, detailValue, hasEmptyOption) {
    const select = document.getElementById(monthSelectId);
    if (!select) return;
    
    const currentValue = select.value;
    select.innerHTML = '';

    if (hasEmptyOption) {
        const emptyOpt = document.createElement('option');
        emptyOpt.value = '';
        select.appendChild(emptyOpt);
    }

    const isSouthern = southernHemisphereDetails.includes(detailValue);
    const start = isSouthern ? 7 : 1;
    const end = isSouthern ? 12 : 6;

    for (let i = start; i <= end; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        select.appendChild(opt);
    }

    if (currentValue && [...select.options].some(o => o.value === currentValue)) {
        select.value = currentValue;
    }
}

// ページ読み込み完了時に処理を実行
window.addEventListener('DOMContentLoaded', function() {
    initParentBirthplaceFields('parent_month', true);
});

// 登録完了後に horse_detail で該当セルへスクロールするため馬名を保存
document.querySelector('form[action="/add_parent"]').addEventListener('submit', function() {
    const pName = document.querySelector('input[name="p_name"]').value;
    if (pName) {
        sessionStorage.setItem('scrollToParent', pName);
    }
});
</script>
{% endblock %}
